<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Enquiry- Tassula ry</title>
</head>
<body>

<header>
    <h1>Adoption Enquiry</h1>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="about.html">Adoption</a>
    <a href="listing.html">Enquiry</a>
    <a href="contact.html">About Us</a>
</nav>

<main>
    <p>If you are interested in adopting an animal, please fill out the form below and we will get back to you as soon as possible.</p>

    <h2>Your Information</h2>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        
        <br><br>

        <label for="animal">Which animal are you interested in?</label>
        <input type="text" id="animal" name="animal" required>
        
        <br><br>

        <label for="message">Tell us about yourself:</label>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
        
        <br><br>

        <input type="submit" value="Submit Enquiry">

        <br><br>
    
    </form>
</main>

<footer>
    <p>Tassula ry- Helping animals find loving homes.</p>
</footer>
    
</body>
</html>
